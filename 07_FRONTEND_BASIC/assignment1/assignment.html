<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스파르타클럽 수강후기 페이지</title>
    <style>

        .slider1 {
            width: min(720px, 100%);
            aspect-ratio 1971 / 294;
            overflow: hidden;
        }

        .track {
            display: flex;
            width: 500%;
            height: 100%;
            animation: roll 8s infinite;
        }

        
        .slide1 {
            width: auto;
            height: 100%;
        }
        .slide1 img {
            width: 100%;
            height: 100%;
            object-fit: contain; /*비율 다른게 여기서 채워짐, 잘리지 않음*/
            display: block;
        }


        .slider {
            width: min(720px, 100%);
            margin: 0 auto;
            aspect-ratio 41 / 20;
            overflow: hidden;
            border-radius: 16px;
        }

        .track {
            display: flex;
            width: 500%;
            height: 100%;
            animation: roll 8s infinite;
        }

        
        .slide {
            width: 20%;
            height: 100%;
        }
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover; /*비율 다른게 여기서 채워짐, 잘리지 않음*/
            display: block;
        }
        /* .stop_text {
            width: min(720px, 100%)
        } */
        
        @keyframes roll {
        0%,  16% { transform: translateX(0); }
        21%,  37% { transform: translateX(-20%); }
        42%,  58% { transform: translateX(-40%); }
        63%,  79% { transform: translateX(-60%); }
        84%,  100% { transform: translateX(-80%); } 
        }

        header {
            display: flex; /* 자식들을 가로 배치 */
            justify-content: space-between; /* 양 끝으로 밀어냄 */
            align-items: center; /* 세로 중앙 정렬 */
            padding: 10px 40px;
            background: #fff;
        }

        header img {
            height: 30px; /* 로고 크기 조절*/
            display: block; /*이미지 아래 여백 제거*/
        }

        nav {
            color: black;
            display: flex; /*링크 가로 배치 */
            gap: 30px; /*링크 사이 산격*/
            background-color: #fff;
            font-size: 16px;
        }

        nav a {
            color: grey;
            text-decoration: none; /* 밑줄 제거 */
            font-size: 15px;
            background-color: #fff;
            font-size: 16px;
        }

        nav a:hover {/* 마우스 올릴 때 */
            background: rgba(128, 128, 128, 0.95);
            border-radius: 4px;
            transition: all 0.2s ease-in-out   
        }
        .moment img {
            width: 100%;
            height: auto;         /* 비율 자동 계산 */
            display: block;
        }
        
    <!-- 로고 + 네비게이션 (기존) -->

    </style>
