<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스파르타클럽 수강후기 페이지</title>
    <style>

        body {
            background: #000;
            color: #fff;
            font-family: "Apple SD Gothic Neo", Helvetica, Arial, sans-serif;
            margin: 0;
        }

        .topbar {
            background: #fff;   /* 화면 전체 폭을 덮는 흰 배경 */
        }
        
        .bar {
            max-width: 1180px;              /* 내용물이 갇히는 폭 */
            margin: 0 auto;                 /* 가운데 정렬 */
            padding: 12px 40px;
            display: flex;                  /* ★ 자식을 가로로 배치 */
            justify-content: space-between; /* 첫 자식은 왼쪽 끝, 마지막은 오른쪽 끝 */
            align-items: center;            /* 세로 중앙 맞춤 */
        }
        
        /* 링크 묶음도 flex 를 줘야 가로로 늘어섭니다 */
        .list1,
        .list2 {
            display: flex;
            gap: 30px;           /* 링크 사이 간격 */
            align-items: center;
        }

        .list1 a,
        .list2 a {
            color: #555;
            text-decoration: none;  /* 밑줄 제거 */
            font-size: 15px;
            padding: 6px 8px;
            border-radius: 4px;
            transition: background 0.2s ease-in-out;
        }

        .list1 a:hover,
        .list2 a:hover {
            background: rgba(0, 0, 0, 0.06);
        }

        .topbar img {
            height: 30px;     /* 로고·버튼 크기 */
            display: block;   /* 이미지 아래 빈 틈 제거 */
        }
        

        /* 텍스트 무빙 연산자 시작*/
        .slider1 {
            width: min(720px, 100%);
            margin: 0 auto;
            height: 100px;
            overflow: hidden;
        }

        .track {
            display: flex;
            width: 500%;
            height: 100%;
            animation: roll 8s infinite;
        }
        
        .slide1 {
            width: 20%;
            height: 100%;
        }
        .slide1 img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            display: block;
            object-position: left center; /*비율 다른게 여기서 채워짐, 잘리지 않음*/
        }
        /* 텍스트 무빙 연산자 끝*/
        
        /* 사진 무빙 연산자 시작, track 연산자는 텍스트 무빙과 공유*/
        .slider {
            width: min(720px, 100%);
            margin: 0 auto;
            aspect-ratio: 41 / 20;
            overflow: hidden;
            border-radius: 16px;
        }

        .track {
            display: flex;
            width: 500%;
            height: 100%;
            animation: roll 8s infinite;
        }
        
        .slide {
            width: 20%;
            height: 100%;
        }
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover; /*비율 다른게 여기서 채워짐, 잘리지 않음*/
            display: block;
        }
        
        /* 회전시킬 때 쓰는 롤 키프레임*/
        @keyframes roll {
        0%,  16% { transform: translateX(0); }
        21%,  37% { transform: translateX(-20%); }
        42%,  58% { transform: translateX(-40%); }
        63%,  79% { transform: translateX(-60%); }
        84%,  100% { transform: translateX(-80%); } 
        }

        header img {
            height: 30px; /* 로고 크기 조절*/
            display: block; /*이미지 아래 여백 제거*/
        } 

        .moment img {
            width: 100%;
            height: auto;         /* 비율 자동 계산 */
            display: block;
        }

        .swiper {
            width: 50%;
            height: 10%;        
        }

        .swiper-slide {
            text-align: center;
            font-size: 30px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .swiper-slide img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        
    </style>
</head>

<body>
