<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>CSS만으로 만든 이미지 슬라이드</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      /* ===== 페이지 기본 ===== */
      body {
        background: #000;
        margin: 0;
        padding: 40px 16px;
        font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        color: #fff;
      }

      /* ===== [1] 슬라이더 바깥 상자(창문) =====
         화면에 보이는 영역. 이 밖으로 나간 슬라이드는 overflow:hidden이 잘라냅니다. */
      .slider {
        width: min(720px, 100%);   /* 최대 720px, 화면이 좁으면 100% */
        margin: 0 auto;            /* 가운데 정렬 */
        aspect-ratio: 41 / 20;     /* 사진이 2460x1200이므로 같은 비율로 고정 */
        overflow: hidden;          /* 창문 밖 영역을 잘라내는 핵심 속성 */
        border-radius: 16px;
      }

      /* ===== [2] 슬라이드를 한 줄로 이어붙인 띠(track) =====
         슬라이드 5장이 가로로 붙어 있고, 이 띠 전체를 왼쪽으로 밀어서 넘깁니다. */
      .track {
        display: flex;             /* 가로로 나란히 */
        width: 500%;               /* 슬라이드 5장 = 창문 너비의 5배 */
        height: 100%;
        animation: roll 8s infinite;  /* [4]의 keyframes를 20초 주기로 무한 반복 */
      }

      /* ===== [3] 슬라이드 한 장 ===== */
      .slide {
        width: 20%;                /* 띠(500%)의 20% = 창문 너비와 정확히 일치 */
        height: 100%;
      }
      .slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;         /* 비율이 달라도 잘라 채움 (찌그러지지 않음) */
        display: block;            /* 이미지 아래 빈 틈 제거 */
      }

      /* ===== [4] 넘김 동작 정의 =====
         translateX의 % 는 '띠 자신의 너비(500%)' 기준입니다.
         따라서 -20% = 창문 1칸 만큼 왼쪽으로 이동.
         각 구간에서 18%p 동안 멈춰 있다가 2%p 동안 미끄러집니다. */
      @keyframes roll {
        0%,   18%  { transform: translateX(0); }      /* 1번 사진 */
        20%,  38%  { transform: translateX(-20%); }   /* 2번 사진 */
        40%,  58%  { transform: translateX(-40%); }   /* 3번 사진 */
        60%,  78%  { transform: translateX(-60%); }   /* 4번 사진 */
        80%,  100% { transform: translateX(-80%); }   /* 1번 사진 복사본 */
      }

      /* ===== [5] 마우스를 올리면 정지 ===== */
      .slider:hover .track {
        animation-play-state: paused;
      }

      /* ===== [6] 움직임을 줄이도록 설정한 사용자 배려 =====
         자동 재생을 끄고, 손으로 넘길 수 있는 스크롤 슬라이드로 바꿔 줍니다. */
      @media (prefers-reduced-motion: reduce) {
        .track {
          animation: none;
          width: 100%;
          overflow-x: auto;
          scroll-snap-type: x mandatory;
        }
        .slide {
          flex: 0 0 100%;
          scroll-snap-align: center;
        }
      }
    </style>
  </head>

  <body>
    <div class="slider">
      <div class="track">
        <div class="slide"><img src="images/people1.png" alt="노트북을 들고 도심에 서 있는 두 사람" /></div>
        <div class="slide"><img src="images/people2.png" alt="카페에서 대화를 나누는 사람들" /></div>
        <div class="slide"><img src="images/people3.png" alt="소파에서 노트북으로 강의를 듣는 사람" /></div>
        <div class="slide"><img src="images/people4.png" alt="소파에 기대 휴대폰을 보는 사람" /></div>

        <!-- [중요] 첫 장과 똑같은 사진을 맨 뒤에 한 번 더 넣습니다.
             마지막 화면과 처음 화면이 같은 그림이라 되감길 때 끊김이 보이지 않습니다.
             화면 낭독기가 같은 사진을 두 번 읽지 않도록 aria-hidden을 붙입니다. -->
        <div class="slide" aria-hidden="true"><img src="images/people1.png" alt="" /></div>
      </div>
    </div>
  </body>
</html>
