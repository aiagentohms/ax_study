<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스파르타클럽 수강후기 페이지</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="header">
        <div class="header-inner">
            <!-- 윗줄: 로고(왼쪽) + 보조 링크(오른쪽) -->
            <div class="row row-top">
                <a href="https://spartaclub.kr/"><img class="logo" src="images/logosp.svg" alt="스파르타클럽"></a>
                <div class="links-sub">
                    <a href="https://hanghae.co/">항해</a>
                    <a href="https://axis.spartapartners.ai/">기업교육</a>
                    <a href="https://spartaclub.kr/blog">블로그</a>
                    <span class="divider"></span>
                    <a href="https://support.spartaclub.kr/">고객센터</a>
                </div>
            </div>

            <!-- 아랫줄: 주 메뉴(왼쪽) + 로그인(오른쪽) -->
            <div class="row row-main">
                <nav class="links-main">
                    <a href="https://spartaclub.kr/catalog/scc">전체 강의</a>
                    <a href="#">취업 캠프</a>
                    <a href="https://scb.spartaclub.kr/">재직자 캠프</a>
                    <a href="https://spartaclub.kr/community/fastqna/all?text=&sort=latest&chapter=&pageChunkSize=10&curPage=1">커뮤니티</a>
                    <a href="#" class="on">수강후기</a>
                    <a href="https://spartaclub.kr/event">이벤트</a>
                </nav>
                <a href="#" class="login">로그인</a>
            </div>
        </div>
    </header>

    <div class="content">
        <!-- 첫 줄: 텍스트 슬라이드 -->
        <div class="slider1">
            <div class="track">
                <div class="slide1"><img src="images/text1.png" alt="새로운 도전을"/></div>
                <div class="slide1"><img src="images/text2.png" alt="자신감을"/></div>
                <div class="slide1"><img src="images/text3.png" alt="잠재력을"/></div>
                <div class="slide1"><img src="images/text4.png" alt="배움의 즐거움을"/></div>
                <div class="slide1" aria-hidden="true"><img src="images/text1.png" alt=""/></div>
            </div>
        </div>

        <!-- 둘째 줄: 깨운 순간들 + 텍스트 -->
        <div class="headline-row">
            <div class="moment">
                <img src="images/moment_only.png" alt="깨운 순간들">
            </div>
            <p class="lead">
                700,000+명의 수강생이 경험한<br>
                잠재력을 깨운 순간,<br>
                직접 확인해보세요.
            </p>
        </div>

        <!-- 사진 슬라이더 -->
        <div class="slider">
            <div class="track">
                <div class="slide"><img src="images/people1.png" alt="사진1"/></div>
                <div class="slide"><img src="images/people2.png" alt="사진2"/></div>
                <div class="slide"><img src="images/people3.png" alt="사진3"/></div>
                <div class="slide"><img src="images/people4.png" alt="사진4"/></div>
                <div class="slide" aria-hidden="true"><img src="images/people1.png" alt=""/></div>
            </div>
        </div>
        <p class="note">*본 이미지 속 인물은 AI로 생성되었습니다.</p>
        <div>
            <a href="#" class="query-btn">
                <img src="images/moon.png" style="width: 128px; height: 60px" alt="문의 사항">
            </a>
        </div>
</body>
</html>
