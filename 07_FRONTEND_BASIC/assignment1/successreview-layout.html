<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스파르타클럽 수강후기 페이지</title>
    <style>
        /* ============================================================
           [기본]
           ============================================================ */
        body {
            background: #000;
            color: #fff;
            font-family: "Apple SD Gothic Neo", Helvetica, Arial, sans-serif;
            margin: 0;
        }

        /* ============================================================
           [1] 상단 바
           배경(.topbar)은 화면 끝까지, 내용물(.bar)은 일정 폭 안에.
           이 둘을 분리하는 게 정렬의 핵심입니다.
           ============================================================ */
        .topbar {
            background: #fff;   /* 화면 전체 폭을 덮는 흰 배경 */
        }

        .bar {
            max-width: 1180px;              /* 내용물이 갇히는 폭 */
            margin: 0 auto;                 /* 가운데 정렬 */
            padding: 12px 40px;
            display: flex;                  /* ★ 자식을 가로로 배치 */
            justify-content: space-between; /* 첫 자식은 왼쪽 끝, 마지막은 오른쪽 끝 */
            align-items: center;            /* 세로 중앙 맞춤 */
        }

        /* 링크 묶음도 flex 를 줘야 가로로 늘어섭니다 */
        .list1,
        .list2 {
            display: flex;
            gap: 30px;           /* 링크 사이 간격 */
            align-items: center;
        }

        .list1 a,
        .list2 a {
            color: #555;
            text-decoration: none;  /* 밑줄 제거 */
            font-size: 15px;
            padding: 6px 8px;
            border-radius: 4px;
            transition: background 0.2s ease-in-out;
        }

        .list1 a:hover,
        .list2 a:hover {
            background: rgba(0, 0, 0, 0.03);
        }

        .topbar img {
            height: 30px;     /* 로고·버튼 크기 */
            display: block;   /* 이미지 아래 빈 틈 제거 */
        }

        /* ============================================================
           [2] 본문 컨테이너
           슬라이더·문구·사진이 전부 이 안에 들어갑니다.
           폭을 바꾸고 싶으면 이 한 곳만 고치면 됩니다.
           ============================================================ */
        .content {
            width: min(720px, 100%);
            margin: 0 auto;
            padding: 80px 20px 120px;
            box-sizing: border-box;   /* padding 을 width 안에 포함시킴 */
        }

        /* 요소 사이 세로 간격을 한 번에 지정 */
        .content > * + * {
            margin-top: 40px;
        }

        /* ============================================================
           [3] 텍스트 슬라이더
           ============================================================ */
        .slider1 {
            width: 100%;      /* 폭은 .content 가 정하므로 100% 로 */
            height: 100px;    /* 글자 크기를 결정하는 값 */
            overflow: hidden;
        }

        .slide1 {
            width: 20%;       /* 띠가 500% 이므로 한 칸은 20% */
            height: 100%;
        }

        .slide1 img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: left center;  /* 왼쪽 기준으로 붙임 */
            display: block;
        }

        /* ============================================================
           [4] 고정 문구 (깨운 순간들)
           ============================================================ */
        .moment img {
            width: 100%;
            height: auto;     /* 비율 자동 계산 */
            display: block;
        }

        /* ============================================================
           [5] 사진 슬라이더
           ============================================================ */
        .slider {
            width: 100%;
            aspect-ratio: 41 / 20;   /* 사진 비율(2460:1200)과 동일 */
            overflow: hidden;
            border-radius: 16px;
        }

        .slide {
            width: 20%;
            height: 100%;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;   /* 비율이 달라도 잘라서 꽉 채움 */
            display: block;
        }

        /* ============================================================
           [6] 두 슬라이더가 공유하는 띠
           ============================================================ */
        .track {
            display: flex;
            width: 500%;
            height: 100%;
            animation: roll 8s infinite;
        }

        .slider:hover .track,
        .slider1:hover .track {
            animation-play-state: paused;
        }

        @keyframes roll {
            0%,  16%  { transform: translateX(0); }
            21%, 37%  { transform: translateX(-20%); }
            42%, 58%  { transform: translateX(-40%); }
            63%, 79%  { transform: translateX(-60%); }
            84%, 100% { transform: translateX(-80%); }
        }

        @media (prefers-reduced-motion: reduce) {
            .track { animation: none; }
        }

        /* ============================================================
           [7] 하단 이미지 · 안내 문구
           ============================================================ */
        .moon img {
            width: 100%;
            height: auto;
            display: block;
        }

        .note {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            font-weight: 400;
            margin: 0;
            text-align: right;   /* 오른쪽 정렬 */
        }
    </style>
</head>

<body>
    <!-- 첫째 줄: 로고(왼쪽) + 링크(오른쪽) -->
    <div class="topbar">
        <div class="bar">
            <a href="https://spartaclub.kr/"><img src="logo.png" alt="스파르타클럽"></a>
            <div class="list1">
                <a href="#">항해</a>
                <a href="#">기업 교육</a>
                <a href="#">블로그</a>
                <a href="#">고객센터</a>
            </div>
        </div>
    </div>

    <!-- 둘째 줄: 메뉴(왼쪽) + 로그인(오른쪽) -->
    <div class="topbar">
        <div class="bar">
            <div class="list2">
                <a href="#">전체 강의</a>
                <a href="#">취업 캠프</a>
                <a href="#">재직자 캠프</a>
                <a href="#">커뮤니티</a>
                <a href="#" style="color: #ee0a3d;">수강후기</a>
                <a href="#">이벤트</a>
            </div>
            <a href="#"><img src="login.png" alt="로그인"></a>
        </div>
    </div>

    <!-- 본문: 아래 요소들이 모두 같은 폭·같은 왼쪽 선을 공유 -->
    <div class="content">
        <div class="slider1">
            <div class="track">
                <div class="slide1"><img src="images/text1.png" alt="새로운 도전을"/></div>
                <div class="slide1"><img src="images/text2.png" alt="자신감을"/></div>
                <div class="slide1"><img src="images/text3.png" alt="잠재력을"/></div>
                <div class="slide1"><img src="images/text4.png" alt="배움의 즐거움을"/></div>
                <div class="slide1" aria-hidden="true"><img src="images/text1.png" alt=""/></div>
            </div>
        </div>

        <div class="moment">
            <img src="images/Kaeun_sungan.png" alt="깨운 순간들">
        </div>

        <div class="slider">
            <div class="track">
                <div class="slide"><img src="images/people1.png" alt="사진1"/></div>
                <div class="slide"><img src="images/people2.png" alt="사진2"/></div>
                <div class="slide"><img src="images/people3.png" alt="사진3"/></div>
                <div class="slide"><img src="images/people4.png" alt="사진4"/></div>
                <div class="slide" aria-hidden="true"><img src="images/people1.png" alt=""/></div>
            </div>
        </div>

        <div class="moon">
            <img src="images/moon.png" alt="">
        </div>

        <p class="note">이미지 속 인물은 AI로 생성되었습니다.</p>
    </div>
</body>
</html>
