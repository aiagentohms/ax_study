<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body {
         margin: 0;
        }
        ul {
        margin: 0;
        padding: 0;
        list-style: none;
        width: 100%;
        height: 100px;
        }

        ul li {
            min-width: 100px;
        }

        li:nth-of-type(1) {
            background: red;
        }
        li:nth-of-type(2) {
            background: blue;
        }
        li:nth-of-type(3) {
            background: green;
        }
        .flex1 {
            display: flex;
            flex-direction: column-reverse;
        }

        .flex2 {
            display: flex;
            justify-content: flex-end;
        }

        .flex3 {
            display: flex;
            justify-content: center;
        }
    </style>
    <ul class="flex1">
        <li>A</li>
        <li>B</li>
        <li>C</li>
    </ul>

    <h3>flex-end</h3>
    <ul class="flex2">
        <li>A</li>
        <li>B</li>
        <li>C</li>
    </ul>

    <h3>center</h3>    
    <ul class="flex3">
        <li>A</li>
        <li>B</li>
        <li>C</li>
    </ul>
</body>
</html>
