<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            border: 1px solid #000;
            height: 100px;
        }

        li {
            /* min-width: 100px; */
            width: 0;
        }

        li:nth-of-type(1) {
            background: red;
            flex-grow: 1;
        }

        li:nth-of-type(2) {
            background: blue;
            flex-grow: 1;
        }

        li:nth-of-type(3) {
            background: green;
            flex-grow: 1;
        }    

        .flex1 {
            display: flex;
        }

    </style>

</head>
<body>
        
    <h3>align-items: stretch(기본값)</h3>
    <ul class="flex1">
        <li>메뉴1</li>
        <li>메뉴2메뉴2메뉴2메뉴2메뉴2메뉴2메뉴2메뉴2메뉴2</li>
        <li>메뉴3</li>
    </ul>

<!-- flex-grow는 공백에 대해 3등분하는 거기 때문에 그냥 쓸 때는 3등분이 안돼있음
width를 0으로 해주면 올바르게 작동 -->


</body>
</html>
