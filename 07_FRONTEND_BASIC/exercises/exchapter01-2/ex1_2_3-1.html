<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
    <h1>설문조사 시작</h1>
    <label>
    성별 <input type="radio" name="gender" value="female" checked> 여성
    </label>
    <label>
        <input type="radio" name="gender" value="male"> 남성
    </label><br>
    <label>
    학년 <input type="radio" name="grade" value="1-3G"> 1-3학년
    </label>
    <label>
        <input type="radio" name="grade" value="4-6G" checked> 4-6학년
    </label><br>
    취미 <label>
        <input type="checkbox" name="hobby" value="cinema"> 영화 감상
    </label>
    <label>
        <input type="checkbox" name="hobby" value="bike"> 자전거 타기
    </label>
    <label>
        <input type="checkbox" name="hobby" value="book"> 독서
    </label><br>
    <input type="submit" name="제출">
</form>
</body>
</html>
